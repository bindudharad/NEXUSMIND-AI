apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusmind-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexusmind-api
  template:
    metadata:
      labels:
        app: nexusmind-api
    spec:
      containers:
        - name: api
          image: ghcr.io/nexusmind-ai/nexusmind-api:2026.06.02-enterprise
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nexusmind-infra-config
            - secretRef:
                name: nexusmind-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: nexusmind-api
spec:
  selector:
    app: nexusmind-api
  ports:
    - port: 8000
      targetPort: 8000
