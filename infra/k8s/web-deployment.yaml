apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusmind-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexusmind-web
  template:
    metadata:
      labels:
        app: nexusmind-web
    spec:
      containers:
        - name: web
          image: ghcr.io/nexusmind-ai/nexusmind-web:2026.06.02-enterprise
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "http://nexusmind-api:8000/api/v1"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: nexusmind-web
spec:
  selector:
    app: nexusmind-web
  ports:
    - port: 3000
      targetPort: 3000
