services:
  api:
    build:
      context: ../../backend
    container_name: nexusmind-api
    env_file:
      - ../../backend/.env.example
    environment:
      POSTGRES_DSN: postgresql+psycopg://nexusmind:nexusmind@postgres:5432/nexusmind
      MONGO_URI: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPARK_MASTER_URL: spark://spark-master:7077
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mongodb
      - redis
      - qdrant
      - neo4j
      - kafka
      - spark-master

  web:
    build:
      context: ../../frontend
    container_name: nexusmind-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: nexusmind-nginx
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nexusmind.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

  postgres:
    image: postgres:16-alpine
    container_name: nexusmind-postgres
    environment:
      POSTGRES_DB: nexusmind
      POSTGRES_USER: nexusmind
      POSTGRES_PASSWORD: nexusmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: nexusmind-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: nexusmind-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: nexusmind-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    container_name: nexusmind-neo4j
    environment:
      NEO4J_AUTH: neo4j/nexusmind
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  kafka:
    image: bitnami/kafka:3.7
    container_name: nexusmind-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka

  spark-master:
    image: bitnami/spark:3.5
    container_name: nexusmind-spark-master
    environment:
      SPARK_MODE: master
    ports:
      - "7077:7077"
      - "8081:8080"

  spark-worker:
    image: bitnami/spark:3.5
    container_name: nexusmind-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
    depends_on:
      - spark-master

volumes:
  postgres_data:
  mongo_data:
  qdrant_data:
  neo4j_data:
  kafka_data:
