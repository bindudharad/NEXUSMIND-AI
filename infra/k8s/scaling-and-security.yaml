apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexusmind-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexusmind-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexusmind-web-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexusmind-web
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nexusmind-api-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nexusmind-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nexusmind-web-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nexusmind-web
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexusmind-api-ingress-policy
spec:
  podSelector:
    matchLabels:
      app: nexusmind-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nexusmind-web
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
