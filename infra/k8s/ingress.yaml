apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexusmind-enterprise-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "nexusmind-api"
spec:
  ingressClassName: nginx
  rules:
    - host: nexusmind.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nexusmind-api
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: nexusmind-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexusmind-web
                port:
                  number: 3000
